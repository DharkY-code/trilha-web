<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Dhark Library</title><style>body{font:16px system-ui;background:#f5f2fa;color:#21172c;margin:0;padding:24px}.wrap{max-width:620px;margin:auto}.card{background:white;border:1px solid #e3d9ef;border-radius:16px;padding:22px}label{display:block;font-weight:650;margin-top:12px}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #cfc2df;border-radius:9px;width:100%;box-sizing:border-box;margin:5px 0}button{background:#7540a8;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#655875}</style><main class="wrap"><div class="card"><h1>Criar conta no Dhark Library</h1><p class="muted">O cadastro exige um convite válido. Nunca compartilhe sua senha.</p><form id="form"><label>Código de convite</label><input name="inviteCode" required autocomplete="off"><label>Nome de usuário (3 a 32 caracteres)</label><input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" autocomplete="username"><label>Nome de exibição</label><input name="displayName" required><label>Senha (mínimo 8 caracteres)</label><input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"><label>Confirmar senha</label><input name="confirm" type="password" required><label>Área principal que deseja estudar</label><input name="mainArea" required maxlength="120" placeholder="Ex.: programação web, matemática, biologia, inglês..."><label>O que deseja aprender ou em que tem dificuldade?</label><textarea name="learningGoal" required maxlength="500" placeholder="Descreva os assuntos, objetivos e dificuldades específicas."></textarea><label>Nível de estudo</label><select name="level"><option value="basico">Básico</option><option value="intermediario">Intermediário</option><option value="curso_completo">Curso completo</option></select><button>Criar conta</button></form><p id="msg" role="status"></p><p><a href="./">Voltar ao Dhark Library</a></p></div></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('password')!==f.get('confirm')){document.querySelector('#msg').textContent='As senhas não coincidem.';return}try{const r=await fetch('/api/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({inviteCode:f.get('inviteCode'),username:f.get('username'),displayName:f.get('displayName'),password:f.get('password'),learningGoal:'Área principal: '+f.get('mainArea')+'\nObjetivos e dificuldades: '+f.get('learningGoal'),area:'programacao',level:f.get('level')})});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível criar a conta.');document.querySelector('#msg').textContent='Conta criada! Você já pode entrar na plataforma.';e.target.reset()}catch(x){document.querySelector('#msg').textContent=x.message}}</script></html>
